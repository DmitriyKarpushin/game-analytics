[project]
name = "game-analytics"
version = "0.1.0"
description = "Synthetic mobile game analytics platform"
requires-python = ">=3.12,<3.14"

dependencies = [
    "numpy>=2.1,<3",
    "PyYAML>=6.0,<7",
    "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
