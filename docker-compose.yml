services:
  postgres:
    image: postgres:17
    container_name: game-analytics-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    shm_size: 256mb

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - analytics_net

  app:
    build:
      context: .

    container_name: game-analytics-app

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - analytics_net

    profiles:
      - tools

  dbt:
    build:
      context: ./analytics/dbt

    container_name: game-analytics-dbt

    env_file:
      - .env

    environment:
      DBT_PROFILES_DIR: /usr/app

    working_dir: /usr/app

    volumes:
      - ./analytics/dbt:/usr/app

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - analytics_net

    profiles:
      - tools

volumes:
  postgres_data:

networks:
  analytics_net:
    driver: bridge
